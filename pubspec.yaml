name: my_toolbox

description: "启动外壳 1. 负责连接框架层和业务层 2. 提供启动方法"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # 依赖版本管理
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  logger: ^2.6.2
  riverpod_annotation: ^3.0.3
  flutter_riverpod: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^10.0.0
  dio: ^5.9.0
  go_router: ^17.0.1
  drift: ^2.30.0
  drift_flutter: ^0.2.8
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.41
  crypto: ^3.0.7
  mmkv: ^2.3.0
  stomp_dart_client: ^3.0.1
  uuid: ^4.5.2

  app_core:
    path: packages/app-core
  framework_biz:
    path: packages/framework-biz
  framework_api:
    path: packages/framework-api
  smart_lifeflow:
    path: packages/features/smart-lifeflow
  event_api:
    path: packages/features/event-api
  event_biz:
    path: packages/features/event-biz
  memo_biz:
    path: packages/features/memo-biz
  pomodoro_biz:
    path: packages/features/pomodoro-biz
  note_biz:
    path: packages/features/note-biz

  dynamic_color: ^1.8.1
  google_fonts: ^6.3.3
  flex_color_scheme: ^8.4.0
  flutter_native_splash: ^2.4.7
  stream_transform: ^2.1.1
  system_clock: ^3.0.0
  geolocator: ^14.0.2
  collection: ^1.19.1
  appflowy_editor: ^6.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  riverpod_generator: ^3.0.3
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.3
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mockito: ^5.6.1
  http_mock_adapter: ^0.6.1
  drift_dev: ^2.30.0
  melos: ^7.0.0

workspace:
  - packages/app-core
  - packages/api/auth-api
  - packages/api/data-api
  - packages/api/sync-api
  - packages/api/network-api
  - packages/framework-api
  - packages/infra/common-ui
  - packages/infra/auth-biz
  - packages/infra/data-biz
  - packages/infra/sync-biz
  - packages/infra/theme-biz
  - packages/infra/network-biz
  - packages/infra/shell-biz
  - packages/framework-biz
  - packages/features/smart-lifeflow
  - packages/features/event-api
  - packages/features/event-biz
  - packages/features/memo-biz
  - packages/features/note-biz
  - packages/features/pomodoro-biz

melos:
  scripts:
    generate:
      run: melos exec -c 1 --depends-on build_runner -- dart run build_runner build

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#ffffff" # 背景色 (建议与你的浅色模式背景一致)
  image: assets/logo.png # 你的 Logo
  fullscreen: true
  linux: true
#  color_dark: "#121212" # 深色模式背景
#  image_dark: assets/images/splash_logo_dark.png # 深色模式 Logo
#  android_12:
#    image: assets/images/splash_logo_android12.png
#    color: "#ffffff"